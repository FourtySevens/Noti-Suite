name: notif-scheduler

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: https://ntfy.foursevens.win
      NTFY_LISTEN_HTTP: :80
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_BEHIND_PROXY: "true"
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - ntfy_data:/var/lib/ntfy
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8093:80"

  scheduler:
    build: .
    restart: unless-stopped
    environment:
      SCHEDULER_API_KEY: ${SCHEDULER_API_KEY:?Set SCHEDULER_API_KEY in .env}
      NTFY_BASE_URL: http://ntfy:80
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_TOPIC_PREFIX: notif-
      DATABASE_PATH: /data/scheduler.db
      EVENTS_PATH: /app/events.json
    volumes:
      - scheduler_data:/data
      - ./events.json:/app/events.json:ro
    depends_on:
      - ntfy
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8080:8080"

volumes:
  ntfy_data:
  scheduler_data:

networks:
  default:
    name: notif-scheduler
